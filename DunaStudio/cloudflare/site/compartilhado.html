<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Álbum compartilhado — Duna</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-spacer"></div>
    <a href="./" class="brand"><img src="img/logo-duna.png" alt="Duna" class="brand-logo"></a>
    <div class="topbar-spacer"></div>
  </header>

  <div class="album-header" id="albumHeader"></div>
  <main class="photo-grid" id="photoGrid"></main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev">‹</button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-nav lightbox-next" id="lightboxNext">›</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/compartilhado.js"></script>
</body>
</html>
