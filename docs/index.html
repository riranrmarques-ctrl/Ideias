<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duna Wedding Flix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

:root {
  --bg: #0d1420;
  --surface: #151f2e;
  --surface-hi: #1d2a3d;
  --ink: #eef3f9;
  --ink-dim: #8ea0b8;
  --gold: #5b9bd9;
  --wine: #1e3a5f;
  --danger: #c0564a;
  --radius: 6px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height: 100%;
}

h1, h2, h3, .display {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  margin: 0;
  letter-spacing: 0.2px;
}

a { color: inherit; text-decoration: none; }

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  border-radius: var(--radius);
}

input {
  font-family: inherit;
}

/* ---------- Topbar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 16px 24px;
  background: linear-gradient(to bottom, rgba(13,20,32,0.95), rgba(13,20,32,0));
}

.topbar-spacer { min-width: 1px; }

.brand {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 22px;
  color: var(--ink);
  justify-self: center;
}

.brand span { color: var(--gold); }
.brand-logo { height: 26px; width: auto; display: block; }

.topbar-menu { position: relative; justify-self: end; }

.menu-toggle {
  background: none;
  color: var(--ink);
  width: 38px;
  height: 38px;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.menu-toggle:hover { color: var(--gold); }

.menu-dropdown {
  position: absolute;
  top: 46px;
  right: 0;
  min-width: 170px;
  background: var(--surface);
  border: 1px solid rgba(238,243,249,0.1);
  border-radius: 8px;
  padding: 6px;
  display: none;
  flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}
.menu-dropdown.open { display: flex; }

.menu-dropdown a, .menu-dropdown button {
  background: none;
  color: var(--ink-dim);
  font-size: 14px;
  padding: 9px 12px;
  border-radius: 5px;
  text-align: left;
  width: 100%;
}
.menu-dropdown a:hover, .menu-dropdown button:hover { background: rgba(238,243,249,0.08); color: var(--ink); }

/* Itens ocultos temporariamente — remova esta classe pra reativar */
.menu-hidden { display: none !important; }

.topbar-actions { display:none; } /* mantido só por compatibilidade, não usado mais */

/* ---------- Hero ---------- */
.hero {
  position: relative;
  min-height: 58vh;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  padding: 60px 40px 56px;
  background: var(--surface);
}

.hero video.hero-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
}

.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(to top, var(--bg) 4%, rgba(13,20,32,0.45) 55%, rgba(13,20,32,0.15) 100%);
}

.hero-content { position: relative; z-index: 2; max-width: 560px; }

.hero-dots {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 6px;
  margin-top: 20px;
}
.hero-dots button {
  width: 22px;
  height: 3px;
  background: rgba(238,243,249,0.3);
  padding: 0;
  border-radius: 2px;
  transition: background 0.2s ease;
}
.hero-dots button.active { background: var(--gold); }

.hero-content .category {
  color: var(--gold);
  font-size: 14px;
  margin-bottom: 10px;
}

.hero-content h1 {
  font-size: 44px;
  line-height: 1.1;
  margin-bottom: 14px;
}

.hero-content p {
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 22px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  font-size: 15px;
  font-weight: 600;
  border-radius: var(--radius);
}

.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover { background: var(--gold); }

.btn-ghost {
  background: rgba(245,239,230,0.1);
  color: var(--ink);
  border: 1px solid rgba(245,239,230,0.25);
}
.btn-ghost:hover { background: rgba(245,239,230,0.18); }

/* ---------- Rows / carousels ---------- */
.rows { padding: 8px 0 60px; }

.row { margin-bottom: 38px; }

.row-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 0 40px;
  margin-bottom: 14px;
}

.row-header h2 { font-size: 20px; font-weight: 600; }

.row-track {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  padding: 4px 40px 14px;
  scroll-behavior: smooth;
}
.row-track::-webkit-scrollbar { height: 6px; }
.row-track::-webkit-scrollbar-thumb { background: var(--surface-hi); border-radius: 4px; }

.card {
  flex: 0 0 auto;
  width: 240px;
  cursor: pointer;
  transition: transform 0.18s ease;
}
.card:hover { transform: translateY(-4px); }

.card-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: var(--radius);
  background: var(--surface) center/cover no-repeat;
  overflow: hidden;
}

.card-thumb .badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(20,16,15,0.75);
  color: var(--gold);
  font-size: 11px;
  padding: 3px 7px;
  border-radius: 4px;
}

.card-thumb .processing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(20,16,15,0.6);
  font-size: 12px;
  color: var(--ink-dim);
  text-align: center;
  padding: 10px;
}

.card-title {
  margin-top: 8px;
  font-size: 14px;
  color: var(--ink);
}

.card-meta { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }

.empty-state {
  padding: 100px 40px;
  text-align: center;
  color: var(--ink-dim);
}
.empty-state h2 { color: var(--ink); margin-bottom: 10px; }

/* ---------- Auth pages ---------- */
.auth-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #1a2942 0%, var(--bg) 60%);
  padding: 20px;
}

.auth-card {
  width: 100%;
  max-width: 380px;
  background: var(--surface);
  border: 1px solid rgba(245,239,230,0.08);
  border-radius: 10px;
  padding: 36px 32px;
}

.auth-card .brand { display: block; text-align: center; margin-bottom: 26px; font-size: 26px; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--ink-dim); margin-bottom: 6px; }
.field input {
  width: 100%;
  padding: 11px 12px;
  background: var(--bg);
  border: 1px solid rgba(245,239,230,0.15);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 14px;
}
.field input:focus {
  outline: none;
  border-color: var(--gold);
}

.auth-card .btn { width: 100%; justify-content: center; margin-top: 6px; }

.error-msg {
  background: rgba(192,86,74,0.12);
  border: 1px solid rgba(192,86,74,0.4);
  color: #e39a90;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: var(--radius);
  margin-bottom: 16px;
  display: none;
}

/* ---------- Watch page ---------- */
.watch-wrap { min-height: 100vh; background: #000; display: flex; flex-direction: column; }
.watch-topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  background: #000;
}
.watch-topbar h1 { font-size: 16px; font-weight: 500; color: var(--ink-dim); }
.watch-topbar .back { color: var(--ink); font-size: 20px; }
video { width: 100%; max-height: 82vh; background: #000; }

.watch-wrap.is-vertical video {
  width: auto;
  max-width: 100%;
  height: 82vh;
  max-height: 82vh;
  margin: 0 auto;
  display: block;
  aspect-ratio: 9/16;
}
.watch-wrap.is-vertical { align-items: center; }
.watch-wrap.is-vertical > video { align-self: center; }
.watch-info { padding: 20px 24px 60px; max-width: 720px; }
.watch-info h2 { font-size: 22px; margin-bottom: 8px; }
.watch-info p { color: var(--ink-dim); font-size: 14px; line-height: 1.6; }
.quality-tag {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  color: var(--gold);
  border: 1px solid rgba(201,161,90,0.4);
  padding: 3px 9px;
  border-radius: 4px;
}

/* ---------- Grade de álbuns (2 colunas, cresce pra baixo) ---------- */
.albums-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  padding: 4px 40px 14px;
}
.albums-grid .card { width: 100%; }
@media (max-width: 480px) {
  .albums-grid { grid-template-columns: 1fr; }
}

/* ---------- Seções dentro do álbum (Make-of, Pré-wedding, Recepção...) ---------- */
.section-block { margin-bottom: 40px; }

.section-banner {
  position: relative;
  height: 220px;
  margin: 0 40px 16px;
  border-radius: 12px;
  background: var(--surface) center/cover no-repeat;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}
.section-banner::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(13,20,32,0.85) 10%, rgba(13,20,32,0.1) 70%);
}
.section-banner-text {
  position: relative;
  z-index: 2;
  padding: 20px 24px;
}
.section-banner-text h2 { font-size: 22px; margin-bottom: 4px; }
.section-banner-text p { color: var(--ink-dim); font-size: 13.5px; }

.section-heading-simple { padding: 0 40px; margin-bottom: 12px; }
.section-heading-simple h2 { font-size: 19px; }

/* ---------- Pacotes / contratação ---------- */
.packages-intro { padding: 36px 40px 8px; text-align: center; }
.packages-intro h1 { font-size: 30px; margin-bottom: 8px; }
.packages-intro p { color: var(--ink-dim); font-size: 14px; }

.packages-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px;
  padding: 24px 40px 70px;
  max-width: 1100px;
  margin: 0 auto;
}

.package-card {
  background: var(--surface);
  border: 1px solid rgba(238,243,249,0.08);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  flex-direction: column;
}
.package-card h2 { font-size: 19px; margin-bottom: 6px; }
.package-card .desc { color: var(--ink-dim); font-size: 13px; margin-bottom: 16px; }
.package-price { font-family: 'Fraunces', serif; font-size: 30px; margin-bottom: 4px; }
.package-price span { font-size: 14px; color: var(--ink-dim); font-family: 'Inter', sans-serif; }

.package-items-list { list-style: none; padding: 0; margin: 14px 0 18px; flex: 1; }
.package-items-list li { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; color: var(--ink-dim); border-bottom: 1px solid rgba(238,243,249,0.06); }
.package-items-list li.included { color: var(--ink); }
.package-items-list .item-price { color: var(--gold); font-size: 12px; }

.customize-panel { display: none; margin-top: 6px; margin-bottom: 14px; }
.customize-panel.open { display: block; }
.customize-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(238,243,249,0.06);
  font-size: 13.5px;
}
.customize-item input { accent-color: var(--gold); width: 16px; height: 16px; }
.customize-item .label { flex: 1; }
.customize-item .price { color: var(--gold); font-size: 12px; }

.package-total {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  text-align: right;
  margin-bottom: 12px;
}

.package-actions { display: flex; flex-direction: column; gap: 8px; }
.package-actions .btn { justify-content: center; width: 100%; }

.checkout-form {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(238,243,249,0.08);
}
.checkout-form.open { display: block; }
.checkout-form .field { margin-bottom: 10px; }

/* ---------- Contrato ---------- */
.contract-wrap { max-width: 720px; margin: 0 auto; padding: 30px 24px 80px; }
.contract-wrap h1 { font-size: 26px; margin-bottom: 6px; }
.contract-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 10px;
  margin-bottom: 24px;
}
.contract-status.pending { background: rgba(201,161,90,0.15); color: var(--gold); }
.contract-status.signed { background: rgba(90,160,90,0.15); color: #8fcf8f; }

.contract-body {
  background: var(--surface);
  border: 1px solid rgba(238,243,249,0.08);
  border-radius: 10px;
  padding: 24px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink-dim);
  white-space: pre-wrap;
  margin-bottom: 24px;
}

.contract-event {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 12px;
}
.contract-event h3 { font-size: 15px; margin-bottom: 2px; }
.contract-event .date { color: var(--gold); font-size: 12px; margin-bottom: 8px; }
.contract-event ul { margin: 0; padding-left: 18px; color: var(--ink-dim); font-size: 13.5px; line-height: 1.7; }

.signature-pad-wrap {
  background: var(--surface);
  border-radius: 10px;
  padding: 20px;
  margin-top: 24px;
}
.signature-pad-wrap label { display:block; font-size:13px; color:var(--ink-dim); margin-bottom:8px; }
#signaturePad {
  width: 100%;
  height: 160px;
  background: #fff;
  border-radius: 6px;
  touch-action: none;
  cursor: crosshair;
}
.signature-actions { display:flex; gap:10px; margin-top:12px; }

.signed-block {
  background: var(--surface);
  border-radius: 10px;
  padding: 20px;
  margin-top: 24px;
  text-align: center;
}
.signed-block img { max-width: 220px; background:#fff; border-radius:6px; padding:8px; margin-bottom:10px; }

/* ---------- Painel de gerenciar (compartilhar/convidados) ---------- */
.manage-panel {
  margin: 0 40px 20px;
  background: var(--surface);
  border-radius: 10px;
  padding: 18px 20px;
}
.manage-panel h3 { font-size: 14px; margin-bottom: 10px; color: var(--gold); }
.manage-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.manage-row label { font-size: 13px; color: var(--ink-dim); display: flex; align-items: center; gap: 6px; }
.manage-link-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid rgba(238,243,249,0.12);
  border-radius: 6px; padding: 8px 10px; font-size: 12.5px; color: var(--ink-dim);
  overflow-x: auto; white-space: nowrap;
}
.section-share-btn {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(13,20,32,0.8); border: 1px solid rgba(238,243,249,0.2);
  color: var(--ink); font-size: 13px;
}

/* ---------- Pedido de produto físico ---------- */
.order-panel {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(5,9,15,0.9);
  display: flex; align-items: center; justify-content: center;
}
.order-panel-inner {
  background: var(--surface); border-radius: 10px; padding: 24px;
  max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto;
}
.order-panel-inner h3 { font-size: 16px; margin-bottom: 14px; }
.product-option {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid rgba(238,243,249,0.08); font-size: 13.5px;
}
.product-option .price { color: var(--gold); }

/* ---------- Álbum de fotos ---------- */
.album-header {
  padding: 40px 40px 20px;
}
.album-header h1 { font-size: 30px; margin-bottom: 8px; }
.album-header p { color: var(--ink-dim); font-size: 14px; max-width: 600px; }

.photo-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  padding: 10px 40px 40px;
}

.photo-thumb {
  position: relative;
  aspect-ratio: 1;
  border-radius: var(--radius);
  background: var(--surface) center/cover no-repeat;
  cursor: pointer;
  transition: opacity 0.15s ease;
}
.photo-thumb:hover { opacity: 0.85; }

.photo-download-btn {
  position: absolute;
  bottom: 6px;
  right: 6px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(13,20,32,0.8);
  border: 1px solid rgba(238,243,249,0.2);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  z-index: 2;
}
.photo-download-btn:hover { background: var(--gold); color: var(--bg); }

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(5,9,15,0.96);
  z-index: 300;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 88vw; max-height: 76vh; object-fit: contain; border-radius: 4px; }
.lightbox-close {
  position: absolute; top: 20px; right: 24px;
  background: none; color: var(--ink); font-size: 22px; padding: 8px;
}
.lightbox-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.08); color: var(--ink); font-size: 28px;
  width: 46px; height: 46px; border-radius: 50%;
}
.lightbox-prev { left: 20px; }
.lightbox-next { right: 20px; }
.lightbox-footer { margin-top: 18px; }

.album-comments {
  max-width: 640px;
  margin: 0 auto 70px;
  padding: 0 24px;
}
.comment-item {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px;
}
.comment-item .meta { color: var(--ink-dim); font-size: 12px; margin-top: 4px; }
#commentInput {
  width: 100%;
  min-height: 70px;
  padding: 11px 12px;
  background: var(--surface);
  border: 1px solid rgba(238,243,249,0.15);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  resize: vertical;
}

/* ---------- Admin: seletor de dono ---------- */
.field select {
  width: 100%;
  padding: 11px 12px;
  background: var(--bg);
  border: 1px solid rgba(238,243,249,0.15);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
}

/* ---------- Admin ---------- */
.admin-wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
.admin-wrap h1 { margin-bottom: 6px; }
.admin-wrap .sub { color: var(--ink-dim); font-size: 14px; margin-bottom: 32px; }

.panel {
  background: var(--surface);
  border: 1px solid rgba(245,239,230,0.08);
  border-radius: 10px;
  padding: 26px;
  margin-bottom: 28px;
}
.panel h2 { font-size: 17px; margin-bottom: 18px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

.field textarea {
  width: 100%;
  padding: 11px 12px;
  background: var(--bg);
  border: 1px solid rgba(245,239,230,0.15);
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
  min-height: 70px;
  resize: vertical;
}

.file-field {
  border: 1px dashed rgba(245,239,230,0.25);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  color: var(--ink-dim);
  font-size: 13px;
  cursor: pointer;
}
.file-field.has-file { border-color: var(--gold); color: var(--ink); }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(245,239,230,0.08); }
th { color: var(--ink-dim); font-weight: 500; font-size: 12px; text-transform: none; }

.status-pill {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  background: rgba(245,239,230,0.1);
  color: var(--ink-dim);
}
.status-pill.ready { background: rgba(90,160,90,0.15); color: #8fcf8f; }
.status-pill.processing { background: rgba(201,161,90,0.15); color: var(--gold); }
.status-pill.error { background: rgba(192,86,74,0.15); color: #e39a90; }

.icon-btn {
  background: none;
  color: var(--ink-dim);
  font-size: 13px;
  padding: 4px 8px;
}
.icon-btn:hover { color: var(--danger); }

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface-hi);
  color: var(--ink);
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 14px;
  border: 1px solid rgba(245,239,230,0.15);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 200;
}
.toast.show { opacity: 1; }

:root { color-scheme: dark; }
body { background: #0d1420; padding-bottom: 64px; }
#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:9000;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(21,31,46,.96);border-top:1px solid #2a3a52;
  font:500 12.5px/1.3 Inter,system-ui,sans-serif;color:#8ea0b8;backdrop-filter:blur(6px)}
#demoBar[hidden]{display:none}
#demoBar b{color:#eef3f9;font-weight:600}
#demoBar .seg{display:inline-flex;border:1px solid #2a3a52;border-radius:6px;overflow:hidden}
#demoBar button{background:none;color:#8ea0b8;padding:6px 10px;border-radius:0;font:inherit;cursor:pointer}
#demoBar button[aria-pressed="true"]{background:#5b9bd9;color:#0d1420}
#demoBar button:focus-visible{outline:2px solid #5b9bd9;outline-offset:1px}
#demoBar .reset{border:1px solid #2a3a52;border-radius:6px}

  #hub {
    color-scheme: dark;
    --bg: #0d1420; --surface: #151f2e; --surface-hi: #1d2a3d; --line: #2a3a52;
    --ink: #eef3f9; --ink-dim: #8ea0b8; --accent: #5b9bd9;
  }
  #hub { background: var(--bg); color: var(--ink); font: 15px/1.6 Inter, system-ui, sans-serif; min-height: 100vh; }
    #hub .wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 48px 64px; display: grid; gap: 40px; }
  #hub header { display: grid; gap: 14px; }
  #hub .logo { height: 44px; width: auto; }
  #hub .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  #hub h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(30px, 5vw, 46px); line-height: 1.1; margin: 0; text-wrap: balance; }
  #hub h1 em { font-weight: 500; color: var(--accent); }
  #hub .lead { color: var(--ink-dim); max-width: 62ch; margin: 0; }
  #hub .roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  #hub .role { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 12px; align-content: start; }
  #hub .role h2 { font-family: Fraunces, Georgia, serif; font-size: 21px; margin: 0; font-weight: 600; }
  #hub .role .who { font-size: 12.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  #hub .role ul { margin: 0; padding-left: 18px; color: var(--ink-dim); font-size: 14px; display: grid; gap: 4px; }
  #hub .role button { justify-self: start; margin-top: 6px; background: var(--accent); color: #0d1420; border: 0; border-radius: 6px; padding: 10px 16px; font: 600 14px Inter, system-ui, sans-serif; cursor: pointer; }
  #hub .role button:hover { filter: brightness(1.08); }
  #hub .role button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #hub .notes { border-top: 1px solid var(--line); padding-top: 24px; display: grid; gap: 10px; }
  #hub .notes h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); margin: 0; font-weight: 600; }
  #hub .notes ul { margin: 0; padding-left: 18px; color: var(--ink-dim); font-size: 14px; display: grid; gap: 6px; max-width: 72ch; }
  #hub code { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--ink); background: var(--surface-hi); padding: 1px 6px; border-radius: 4px; }
  @media (prefers-reduced-motion: no-preference) {
    #hub .role { transition: border-color .15s; }
    #hub .role:hover { border-color: var(--accent); }
  }

  let db = readStore();
  if (!db || !db.users) { db = seedData(); writeStore(db); }
  const save = () => writeStore(db);
  const nextId = () => ++db.nextId;

  // ---------- Serializadores ----------
  function videoOut(v) {
    let status = v.status;
    if (status.startsWith('processing') && v.created_ms) {
      const pct = Math.min(100, Math.round((Date.now() - v.created_ms) / 250));
      if (pct >= 100 && v.auto_ready) { v.status = status = 'ready'; v.max_quality = v.max_quality || '4K'; v.duration_seconds = v.duration_seconds || 312; save(); }
      else status = 'processing:' + Math.min(pct, 99) + '%';
    }
    return { id: v.id, title: v.title, description: v.description, category: v.category, status, duration_seconds: v.duration_seconds,
      max_quality: v.max_quality, orientation: v.orientation, owner_user_id: v.owner_user_id,
      poster_url: v.poster_data || poster(v.seed), hls_url: '' };
  }
  function photoOut(p) {
    const url = p.data || photo(p.seed, p.vertical);
    return { id: p.id, url, thumb_url: url, section_id: p.section_id, source: p.source, uploader_name: p.uploader_name || '' };
  }
  function albumCover(a) {
    if (a.cover_data) return a.cover_data;
    const first = db.photos.find(p => p.album_id === a.id);
    return first && first.data ? first.data : scene(a.seed, 800, 534, true);
  }
  function albumSummary(a) {
    return { id: a.id, title: a.title, description: a.description, category: a.category, owner_user_id: a.owner_user_id, cover_url: albumCover(a) };
  }
  function albumFull(a, onlySectionId) {
    const secs = db.sections.filter(s => s.album_id === a.id && (!onlySectionId || s.id === onlySectionId));
    const sections = secs.map(s => {
      const photos = db.photos.filter(p => p.section_id === s.id).map(photoOut);
      return { id: s.id, title: s.title, description: s.description, cover_url: photos[0] ? photos[0].url : '', photos };
    });
    const photos = onlySectionId ? [] : db.photos.filter(p => p.album_id === a.id && !p.section_id).map(photoOut);
    return { ...albumSummary(a), sections, photos, allPhotosCount: db.photos.filter(p => p.album_id === a.id).length,
      guest_upload_enabled: !!a.guest_upload_enabled };
  }
  const emailOf = (uid) => (db.users.find(u => u.id === uid) || {}).email || '—';

  // ---------- Utilidades ----------
  function json(data, status = 200) {
    return new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  }
  const err = (status, msg) => json({ error: msg }, status);
  const me = () => db.session ? db.users.find(u => u.id === db.session) || null : null;
  const canSee = (ownerId, user) => !ownerId || (user && (user.is_admin || user.id === ownerId));

  async function fileToDataUrl(file, max = 1400) {
    if (!file || !file.type || !file.type.startsWith('image/')) return null;
    try {
      const bmp = await createImageBitmap(file);
      const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      return { data: c.toDataURL('image/jpeg', 0.78), vertical: c.height > c.width };
    } catch { return null; }
  }
  async function storePhotos(files, albumId, sectionId, extra = {}) {
    const list = files.slice(0, 20);
    for (const f of list) {
      const out = await fileToDataUrl(f);
      if (!out) continue;
      db.photos.push({ id: nextId(), album_id: albumId, section_id: sectionId, seed: 0, vertical: out.vertical, data: out.data, source: 'studio', ...extra });
    }
    save();
    return list.length;
  }

  // ---------- Rotas ----------
  async function handle(method, path, body, form) {
    const user = me();
    const isAdmin = !!(user && user.is_admin);
    let m;

    // Auth
    if (path === '/api/auth/me') return user ? json({ id: user.id, email: user.email, isAdmin }) : err(401, 'Não autenticado');
    if (path === '/api/auth/login' && method === 'POST') {
      const u = db.users.find(x => x.email.toLowerCase() === String(body.email || '').trim().toLowerCase());
      if (!u || u.password !== body.password) return err(401, 'Email ou senha incorretos');
      db.session = u.id; save();
      return json({ isAdmin: !!u.is_admin });
    }
    if (path === '/api/auth/logout') { db.session = null; save(); return json({ ok: true }); }
    if (path === '/api/auth/users') {
      if (!isAdmin) return err(403, 'Apenas admin');
      if (method === 'POST') {
        if (!body.email || !body.password) return err(400, 'Email e senha obrigatórios');
        if (db.users.some(u => u.email === body.email)) return err(400, 'Esse email já existe');
        const u = { id: nextId(), email: body.email, password: body.password, is_admin: 0, created_at: new Date().toISOString() };
        db.users.push(u); save(); return json({ id: u.id });
      }
      return json(db.users.map(u => ({ id: u.id, email: u.email, is_admin: u.is_admin, created_at: u.created_at })));
    }
    if ((m = path.match(/^\/api\/auth\/users\/(\d+)$/)) && method === 'DELETE') {
      if (!isAdmin) return err(403, 'Apenas admin');
      db.users = db.users.filter(u => u.id !== +m[1]); save(); return json({ ok: true });
    }

    // Vídeos
    if (path === '/api/videos/portfolio') return json(db.videos.filter(v => !v.owner_user_id).map(videoOut));
    if (path === '/api/videos') {
      if (!user) return err(401, 'Não autenticado');
      if (method === 'POST') {
        if (!isAdmin) return err(403, 'Apenas admin');
        const posterFile = form && form.get('poster');
        const posterData = posterFile && posterFile.size ? (await fileToDataUrl(posterFile, 960) || {}).data : null;
        const owner = form.get('ownerUserId');
        db.videos.push({ id: nextId(), title: form.get('title') || 'Novo filme', description: form.get('description') || '', category: form.get('category') || 'Casamentos',
          status: 'processing', duration_seconds: 0, max_quality: '', orientation: 'horizontal', owner_user_id: owner ? +owner : null,
          seed: Math.floor(Math.random() * 500), poster_data: posterData, created_ms: Date.now(), auto_ready: true });
        save(); return json({ ok: true });
      }
      const list = isAdmin ? db.videos : db.videos.filter(v => v.owner_user_id === user.id);
      return json(list.map(videoOut));
    }
    if ((m = path.match(/^\/api\/videos\/(\d+)$/))) {
      const v = db.videos.find(x => x.id === +m[1]);
      if (method === 'DELETE') { if (!isAdmin) return err(403, 'Apenas admin'); db.videos = db.videos.filter(x => x !== v); save(); return json({ ok: true }); }
      if (!v) return err(404, 'Não encontrado');
      if (!canSee(v.owner_user_id, user)) return err(403, 'Privado');
      return json(videoOut(v));
    }

    // Álbuns: compartilhamento e convidados (sem login)
    if ((m = path.match(/^\/api\/albums\/share\/([\w-]+)$/))) {
      const s = db.shares.find(x => x.token === m[1]);
      if (!s) return err(404, 'Link inválido');
      const a = db.albums.find(x => x.id === s.album_id);
      if (!a) return err(404, 'Link inválido');
      const full = albumFull(a, s.section_id);
      if (s.section_id && full.sections[0]) full.title = `${a.title} · ${full.sections[0].title}`;
      return json({ ...full, allowDownload: s.allow_download });
    }
    if ((m = path.match(/^\/api\/albums\/guest-upload\/([\w-]+)(\/photos)?$/))) {
      const a = db.albums.find(x => x.guest_upload_enabled && x.guest_upload_token === m[1]);
      if (!a) return err(404, 'Link inativo');
      if (!m[2]) return json({ title: a.title });
      let sec = db.sections.find(s => s.album_id === a.id && s.title === 'Fotos dos convidados');
      if (!sec) { sec = { id: nextId(), album_id: a.id, title: 'Fotos dos convidados', description: 'Enviadas pelos convidados durante a festa' }; db.sections.push(sec); }
      const n = await storePhotos(form.getAll('photos'), a.id, sec.id, { source: 'guest', uploader_name: form.get('uploaderName') || 'Convidado' });
      return json({ uploading: n });
    }

    if (path === '/api/albums/portfolio') return json(db.albums.filter(a => !a.owner_user_id).map(albumSummary));
    if (path === '/api/albums') {
      if (!user) return err(401, 'Não autenticado');
      if (method === 'POST') {
        if (!isAdmin) return err(403, 'Apenas admin');
        if (!body.title) return err(400, 'Título obrigatório');
        const a = { id: nextId(), title: body.title, description: body.description || '', category: body.category || 'Casamentos',
          owner_user_id: body.ownerUserId ? +body.ownerUserId : null, seed: Math.floor(Math.random() * 500) };
        db.albums.push(a); save(); return json({ id: a.id });
      }
      const list = isAdmin ? db.albums : db.albums.filter(a => a.owner_user_id === user.id);
      return json(list.map(albumSummary));
    }
    if ((m = path.match(/^\/api\/albums\/(\d+)(\/.*)?$/))) {
      const a = db.albums.find(x => x.id === +m[1]);
      const sub = m[2] || '';
      if (!a) return err(404, 'Álbum não encontrado');
      if (!canSee(a.owner_user_id, user)) return err(403, 'Privado');
      const owns = user && (isAdmin || a.owner_user_id === user.id);

      if (!sub) {
        if (method === 'DELETE') {
          if (!isAdmin) return err(403, 'Apenas admin');
          db.albums = db.albums.filter(x => x !== a); db.photos = db.photos.filter(p => p.album_id !== a.id); save();
          return json({ ok: true });
        }
        return json(albumFull(a));
      }
      if (sub === '/sections' && method === 'POST') {
        if (!isAdmin) return err(403, 'Apenas admin');
        const s = { id: nextId(), album_id: a.id, title: body.title, description: '' };
        db.sections.push(s); save(); return json({ id: s.id });
      }
      if (sub === '/photos' && method === 'POST') {
        if (!isAdmin) return err(403, 'Apenas admin');
        const sectionId = form.get('sectionId');
        const n = await storePhotos(form.getAll('photos'), a.id, sectionId ? +sectionId : null);
        return json({ uploading: n });
      }
      if (sub === '/comments') {
        if (!owns) return err(403, 'Só o dono do álbum pode comentar');
        if (method === 'POST') {
          if (!body.body) return err(400, 'Comentário vazio');
          db.comments.push({ id: nextId(), album_id: a.id, user_id: user.id, body: body.body, created_at: new Date().toISOString() });
          save(); return json({ ok: true });
        }
        return json(db.comments.filter(c => c.album_id === a.id).map(c => ({ ...c, author: emailOf(c.user_id) })));
      }
      if (!owns) return err(403, 'Sem permissão');
      if (sub === '/share' || (m = sub.match(/^\/sections\/(\d+)\/share$/))) {
        const sectionId = sub === '/share' ? null : +m[1];
        const token = Math.random().toString(36).slice(2, 12);
        db.shares.push({ token, album_id: a.id, section_id: sectionId, allow_download: !!body.allowDownload }); save();
        return json({ token });
      }
      if (sub === '/guest-upload/toggle') {
        a.guest_upload_enabled = body.enabled ? 1 : 0;
        if (body.enabled && !a.guest_upload_token) a.guest_upload_token = Math.random().toString(36).slice(2, 12);
        save(); return json({ token: body.enabled ? a.guest_upload_token : null });
      }
    }

    // Contratos
    if (path === '/api/contracts') {
      if (!isAdmin) return err(403, 'Apenas admin');
      if (method === 'POST') {
        const c = { id: nextId(), owner_user_id: +body.ownerUserId, title: body.title, body: body.body || '', status: 'pending',
          signer_name: '', signature_data_url: '', signed_at: null, events: body.events || [] };
        db.contracts.push(c); save(); return json({ id: c.id });
      }
      return json(db.contracts.map(c => ({ ...c, owner_email: emailOf(c.owner_user_id) })));
    }
    if (path === '/api/contracts/mine') {
      if (!user) return err(401, 'Não autenticado');
      return json(db.contracts.filter(c => c.owner_user_id === user.id));
    }
    if ((m = path.match(/^\/api\/contracts\/(\d+)(\/sign)?$/))) {
      const c = db.contracts.find(x => x.id === +m[1]);
      if (!c) return err(404, 'Contrato não encontrado');
      if (!user || !(isAdmin || c.owner_user_id === user.id)) return err(403, 'Sem permissão');
      if (method === 'DELETE') { db.contracts = db.contracts.filter(x => x !== c); save(); return json({ ok: true }); }
      if (m[2]) {
        if (c.status === 'signed') return err(400, 'Contrato já assinado');
        Object.assign(c, { status: 'signed', signer_name: body.signerName, signature_data_url: body.signatureDataUrl, signed_at: new Date().toISOString() });
        save(); return json({ ok: true });
      }
      return json(c);
    }

    // Pacotes
    const pkgOut = (p) => ({ ...p, basePrice: p.items.filter(i => i.default_included).reduce((s, i) => s + i.price, 0) });
    if (path === '/api/packages') {
      if (method === 'POST') {
        if (!isAdmin) return err(403, 'Apenas admin');
        const p = { id: nextId(), title: body.title, description: body.description || '',
          items: (body.items || []).map(i => ({ id: nextId(), label: i.label, price: i.price, default_included: i.defaultIncluded ? 1 : 0 })) };
        db.packages.push(p); save(); return json({ id: p.id });
      }
      return json(db.packages.map(pkgOut));
    }
    if (path === '/api/packages/orders/all') return isAdmin ? json(db.orders) : err(403, 'Apenas admin');
    if ((m = path.match(/^\/api\/packages\/(\d+)(\/checkout)?$/))) {
      const p = db.packages.find(x => x.id === +m[1]);
      if (method === 'DELETE') { if (!isAdmin) return err(403, 'Apenas admin'); db.packages = db.packages.filter(x => x !== p); save(); return json({ ok: true }); }
      if (m[2] && p) {

        db.orders.unshift({ id: nextId(), package_id: p.id, package_title: p.title, total: items.reduce((s, i) => s + i.price, 0),
          payer_name: body.payerName, payer_email: body.payerEmail, status: 'approved', created_at: new Date().toISOString() });

        save(); return json({ ok: true });
      }
      return json(db.products);
    }
    if (path === '/api/products/orders/all') return isAdmin ? json(db.productOrders) : err(403, 'Apenas admin');
    if ((m = path.match(/^\/api\/products\/(\d+)(\/order)?$/))) {
      const p = db.products.find(x => x.id === +m[1]);
      if (method === 'DELETE') { if (!isAdmin) return err(403, 'Apenas admin'); db.products = db.products.filter(x => x !== p); save(); return json({ ok: true }); }
      if (m[2] && p) {
        const qty = Math.max(1, parseInt(body.quantity, 10) || 1);
        db.productOrders.unshift({ id: nextId(), product_title: p.title, quantity: qty, total: p.price * qty,
          payer_name: body.payerName, payer_email: body.payerEmail, status: 'approved', created_at: new Date().toISOString() });
        save(); return json({ checkoutUrl: 'checkout-sucesso.html' });
      }
    }

    // Depoimentos
    const tOut = (t) => ({ ...t, photo_url: t.photo_url || (t.photo_seed ? scene(t.photo_seed, 800, 534, true) : ''), owner_email: emailOf(t.owner_user_id) });
    if (path === '/api/testimonials/portfolio') return json(db.testimonials.filter(t => t.approved).map(tOut));
    if (path === '/api/testimonials') {
      if (method === 'POST') {
        if (!user) return err(401, 'Não autenticado');
        db.testimonials.push({ id: nextId(), owner_user_id: user.id, client_name: body.clientName, quote: body.quote, photo_url: body.photoUrl || '', approved: 0 });
        save(); return json({ ok: true });
      }
      return isAdmin ? json(db.testimonials.map(tOut)) : err(403, 'Apenas admin');
    }
    if ((m = path.match(/^\/api\/testimonials\/(\d+)(\/approve)?$/))) {
      if (!isAdmin) return err(403, 'Apenas admin');
      const t = db.testimonials.find(x => x.id === +m[1]);
      if (m[2]) { if (t) t.approved = 1; } else db.testimonials = db.testimonials.filter(x => x !== t);
      save(); return json({ ok: true });
    }

    return err(404, 'Rota não encontrada na demonstração');
  }

  // ---------- Interceptação do fetch ----------
  const realFetch = window.fetch.bind(window);
  window.fetch = async function (input, init = {}) {
    const url = typeof input === 'string' ? input : input.url;
    const u = new URL(url, location.href);
    const path = url.startsWith('/api/') ? url.split('?')[0] : (u.pathname.includes('/api/') ? u.pathname.slice(u.pathname.indexOf('/api/')) : null);
    if (!path) return realFetch(input, init);
    const method = (init.method || 'GET').toUpperCase();
    let body = {}, form = null;
    if (init.body instanceof FormData) form = init.body;
    else if (typeof init.body === 'string') { try { body = JSON.parse(init.body); } catch {} }
    await new Promise(r => setTimeout(r, 60));
    try { return await handle(method, path, body, form); }
    catch (e) { console.error(e); return err(500, 'Erro na demonstração: ' + e.message); }
  };

  // ---------- Roteador: todas as páginas rodam dentro de um único documento ----------
  // window.__PAGES é gerado no build: { 'album.html': { title, body, run } }
  const ROUTE_KEY = 'wfdemo_route';
  let route = { page: 'demo', search: '' };
  let cleanups = [];
  window.__demoSearch = () => route.search;
  window.__demoBase = () => '';

  function trackGlobals() {
    const docAdd = document.addEventListener.bind(document);
    const winAdd = window.addEventListener.bind(window);
    const origSetInterval = window.setInterval.bind(window);
    const ready = [];
    document.addEventListener = (type, fn, opt) => {
      if (type === 'DOMContentLoaded') { ready.push(fn); return; }
      docAdd(type, fn, opt); cleanups.push(() => document.removeEventListener(type, fn, opt));
    };
    window.addEventListener = (type, fn, opt) => {
      winAdd(type, fn, opt); cleanups.push(() => window.removeEventListener(type, fn, opt));
    };
    window.setInterval = (fn, ms) => { const id = origSetInterval(fn, ms); cleanups.push(() => clearInterval(id)); return id; };
    return { ready, restore() {
      delete document.addEventListener;
      delete window.addEventListener;
      window.setInterval = origSetInterval;
    } };
  }

  window.__demoGo = function (href) {
    const mq = String(href || '').match(/^(?:\.\/)?([\w-]+\.html|demo)(\?[^#]*)?/);
    const page = mq && window.__PAGES[mq[1]] ? mq[1] : 'portfolio.html';
    route = { page, search: (mq && mq[2]) || '' };
    try { sessionStorage.setItem(ROUTE_KEY, JSON.stringify(route)); } catch {}
    cleanups.forEach(fn => { try { fn(); } catch {} });
    cleanups = [];

let albumData = null;

let canDownload = false;

function el(id) { return document.getElementById(id); }

async function loadAlbum() {
  const params = new URLSearchParams(window.__demoSearch());
  const albumId = params.get('id');
  if (!albumId) { __demoGo('portfolio.html'); return; }

  const user = await trySession();
  el('backLink').href = user ? 'minha-area.html' : 'portfolio.html';

      </div>`;
    return;
  }
  if (!res.ok) { __demoGo('portfolio.html'); return; }
  albumData = await res.json();

  const canInteract = !!user; // download/comentário exigem login; o backend valida propriedade de fato

  el('albumHeader').innerHTML = `
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:16px;">

      </div>

  if (canInteract) setupManagePanel();

  function photoGridHTML(photos) {
    if (!photos.length) return '';
    return `<div class="photo-grid">${photos.map(p => {
      const globalIndex = albumData.__flatPhotos.findIndex(fp => fp.id === p.id);
      return `
        <div class="photo-thumb" style="background-image:url('${p.thumb_url}')" onclick="openLightbox(${globalIndex})">
          ${canInteract ? `<a class="photo-download-btn" href="/api/albums/photos/${p.id}/download" onclick="event.stopPropagation()" title="Baixar esta foto">⬇</a>` : ''}

  }

(async () => {
  const user = await trySession();
  document.querySelector('.back').href = user ? 'minha-area.html' : 'portfolio.html';

  const params = new URLSearchParams(window.__demoSearch());
  const videoId = params.get('id');

  const res = await fetch(`/api/videos/${videoId}`);
  if (res.status === 403) {
    document.querySelector('.watch-wrap').innerHTML = `
      <div class="watch-info" style="padding-top:80px; max-width:480px; margin:0 auto; text-align:center;">
        <h2>Este vídeo é privado</h2>
        <p style="margin-bottom:20px;">Faça login com a conta do cliente pra assistir.</p>
        <a class="btn btn-primary" href="login.html">Entrar</a>
      </div>`;
    return;
  }
  if (!res.ok) { __demoGo('portfolio.html'); return; }
  const video = await res.json();

  document.getElementById('videoTitleTop').textContent = video.title;
  document.getElementById('videoTitle').textContent = video.title;
  document.getElementById('videoDescription').textContent = video.description || '';

  if (video.max_quality) {
    const tag = document.getElementById('qualityTag');
    tag.textContent = `Qualidade máxima: ${video.max_quality}`;
    tag.style.display = 'inline-block';
  }

  if (video.orientation === 'vertical') {
    document.querySelector('.watch-wrap').classList.add('is-vertical');
  }

  const videoEl = document.getElementById('player');
  const progressKey = 'wf_progress_' + video.id;

  if (video.status !== 'ready') {
    document.querySelector('.watch-info').insertAdjacentHTML('beforeend',
      `<p style="color:var(--gold); margin-top:12px;">Este vídeo ainda está sendo processado. Volte em alguns minutos.</p>`);
    return;
  }

  function restoreProgress() {
    try {
      const raw = localStorage.getItem(progressKey);
      if (!raw) return;
      const { time } = JSON.parse(raw);
      if (time && time > 5) videoEl.currentTime = time;
    } catch {}
  }

  function saveProgress() {
    if (!videoEl.duration) return;
    const pct = Math.round((videoEl.currentTime / videoEl.duration) * 100);
    localStorage.setItem(progressKey, JSON.stringify({ time: videoEl.currentTime, pct }));
  }

  videoEl.addEventListener('timeupdate', () => {
    // salva a cada ~5s de reprodução, não a cada frame
    if (Math.floor(videoEl.currentTime) % 5 === 0) saveProgress();
  });
  videoEl.addEventListener('pause', saveProgress);
  window.addEventListener('beforeunload', saveProgress);

  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ startLevel: -1, capLevelToPlayerSize: true });
    hls.loadSource(video.hls_url);
    hls.attachMedia(videoEl);
    hls.on(Hls.Events.MANIFEST_PARSED, () => restoreProgress());
  } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari/iOS tocam HLS nativamente
    videoEl.src = video.hls_url;
    videoEl.addEventListener('loadedmetadata', restoreProgress, { once: true });
  } else {
    document.querySelector('.watch-info').insertAdjacentHTML('beforeend',
      `<p style="color:var(--danger); margin-top:12px;">Seu navegador não suporta reprodução HLS.</p>`);
  }
})();

oductBtn\" type=\"button\">Adicionar produto</button>\n      <table style=\"margin-top:18px;\" id=\"productsTable\">\n        <thead><tr><th>Produto</th><th>Preço</th><th></th></tr></thead>\n        <tbody></tbody>\n      </table>\n    </div>\n\n    <div class=\"panel\">\n      <h2>Pedidos de produtos físicos</h2>\n      <table id=\"productOrdersTable\">\n        <thead><tr><th>Produto</th><th>Cliente</th><th>Valor</th><th>Status</th></tr></thead>\n        <tbody></tbody>\n      </table>\n    </div>\n\n    <div class=\"panel\">\n      <h2>Depoimentos pendentes</h2>\n      <table id=\"testimonialsTable\">\n        <thead><tr><th>Cliente</th><th>Depoimento</th><th>Status</th><th></th></tr></thead>\n        <tbody></tbody>\n      </table>\n    </div>\n\n    <div class=\"panel\">\n      <h2>Novo contrato</h2>\n      <div class=\"grid-2\">\n        <div class=\"field\">\n          <label>Cliente</label>\n          <select id=\"contractOwner\"><option value=\"\">Selecione um cliente</option></select>\n        </div>\n        <div class=\"field\">\n          <label>Título do contrato</label>\n          <input type=\"text\" id=\"contractTitle\" placeholder=\"Contrato de Prestação de Serviços — Ana &amp; Pedro\">\n        </div>\n      </div>\n      <div class=\"field\">\n        <label>Texto do contrato</label>\n        <textarea id=\"contractBody\" style=\"min-height:120px;\" placeholder=\"Cláusulas, condições de pagamento, prazos de entrega...\"></textarea>\n      </div>\n      <div class=\"field\">\n        <label>Eventos contratados</label>\n        <textarea id=\"contractEvents\" style=\"min-height:160px; font-family:monospace; font-size:12.5px;\" placeholder=\"Cerimônia | 14/11/2026\n2 fotógrafos\nÁlbum impresso 30x30cm\n6 horas de cobertura\n\nRecepção | 14/11/2026\n1 fotógrafo\nMaking-of incluso\"></textarea>\n        <p style=\"font-size:12px; color:var(--ink-dim); margin-top:6px;\">Um evento por bloco (separado por linha em branco). Primeira linha: <code>Nome do evento | data</code> (data opcional). As linhas seguintes são os itens contratados daquele evento.</p>\n      </div>\n      <button class=\"btn btn-primary\" id=\"createContractBtn\" type=\"button\">Criar contrato</button>\n    </div>\n\n    <div class=\"panel\">\n      <h2>Contratos cadastrados</h2>\n      <table id=\"contractsTable\">\n        <thead><tr><th>Título</th><th>Cliente</th><th>Status</th><th></th></tr></thead>\n        <tbody></tbody>\n      </table>\n    </div>\n\n    <div class=\"panel\">\n      <h2>Contas de clientes</h2>\n      <form id=\"userForm\" class=\"grid-2\" style=\"margin-bottom:16px;\">\n        <div class=\"field\"><label>Email do cliente</label><input type=\"email\" id=\"userEmail\" required></div>\n        <div class=\"field\"><label>Senha inicial</label><input type=\"text\" id=\"userPassword\" required minlength=\"6\"></div>\n        <button type=\"submit\" class=\"btn btn-ghost\" style=\"grid-column: span 2;\">Criar acesso</button>\n      </form>\n      <table id=\"usersTable\">\n        <thead><tr><th>Email</th><th>Criado em</th><th></th></tr></thead>\n        <tbody></tbody>\n      </table>\n    </div>\n  </div>\n\n  <div class=\"toast\" id=\"toast\"></div>", run: function () {
// js/auth-guard.js
// Verifica sessão antes de renderizar a página; redireciona pro login se necessário.
window.CURRENT_USER = null;

async function requireSession() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) throw new Error();
    const user = await res.json();
    window.CURRENT_USER = user;
    const adminLink = document.getElementById('adminLink');
    if (adminLink && user.isAdmin) adminLink.style.display = 'block';
    return user;
  } catch {
    __demoGo('login.html');
    throw new Error('redirecting');
  }
}

// Versão que NÃO redireciona — usada em páginas públicas (portfólio, vídeo/álbum públicos)
async function trySession() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) throw new Error();
    const user = await res.json();
    window.CURRENT_USER = user;
    const adminLink = document.getElementById('adminLink');
    if (adminLink && user.isAdmin) adminLink.style.display = 'block';
    return user;
  } catch {
    window.CURRENT_USER = null;
    return null;
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      __demoGo('login.html');
    });
  }

  // Menu símbolo (☰) no topbar — abre/fecha o dropdown de navegação

  if (menuToggle && menuDropdown) {

      menuDropdown.classList.toggle('open');

});

// js/admin.js
let selectedVideoFile = null;
let selectedPosterFile = null;
let pollTimer = null;
let clients = [];
let activeAlbumIdForUpload = null;

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function ownerOptionsHTML() {
  return `<option value="">Público — aparece no portfólio pra qualquer visitante</option>` +
    clients.map(c => `<option value="${c.id}">${c.email}</option>`).join('');
}

async function loadClientsForDropdowns() {
  const res = await fetch('/api/auth/users');
  if (!res.ok) return;
  const users = await res.json();
  clients = users.filter(u => !u.is_admin);
  document.getElementById('videoOwner').innerHTML = ownerOptionsHTML();
  document.getElementById('albumOwner').innerHTML = ownerOptionsHTML();
  const contractOwnerSelect = document.getElementById('contractOwner');
  if (contractOwnerSelect) {
    contractOwnerSelect.innerHTML = `<option value="">Selecione um cliente</option>` +
      clients.map(c => `<option value="${c.id}">${c.email}</option>`).join('');
  }
}

function ownerLabel(ownerId) {
  if (!ownerId) return '🌐 Público';
  const c = clients.find(x => x.id === ownerId);
  return c ? `🔒 ${c.email}` : '🔒 Privado';
}

// ---------- Upload de vídeo ----------
function setupDropZone(dropEl, inputEl, onFile) {
  dropEl.addEventListener('click', () => inputEl.click());
  inputEl.addEventListener('change', () => { if (inputEl.files[0]) onFile(inputEl.files[0]); });
  ['dragover', 'dragenter'].forEach(evt =>
    dropEl.addEventListener(evt, (e) => { e.preventDefault(); dropEl.classList.add('has-file'); })
  );
  dropEl.addEventListener('dragleave', () => { if (!dropEl.dataset.filled) dropEl.classList.remove('has-file'); });
  dropEl.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) onFile(file);
  });
}

setupDropZone(document.getElementById('videoDrop'), document.getElementById('videoInput'), (file) => {
  selectedVideoFile = file;
  const elx = document.getElementById('videoDrop');
  elx.textContent = `🎬 ${file.name} (${(file.size / (1024 ** 3)).toFixed(2)} GB)`;
  elx.classList.add('has-file'); elx.dataset.filled = '1';
});
setupDropZone(document.getElementById('posterDrop'), document.getElementById('posterInput'), (file) => {
  selectedPosterFile = file;
  const elx = document.getElementById('posterDrop');
  elx.textContent = `🖼️ ${file.name}`;
  elx.classList.add('has-file'); elx.dataset.filled = '1';
});

document.getElementById('uploadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!selectedVideoFile) { showToast('Selecione o arquivo de vídeo'); return; }
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  const fd = new FormData();
  fd.append('title', document.getElementById('title').value);
  fd.append('category', document.getElementById('category').value);
  fd.append('description', document.getElementById('description').value);
  fd.append('ownerUserId', document.getElementById('videoOwner').value);
  fd.append('video', selectedVideoFile);
  if (selectedPosterFile) fd.append('poster', selectedPosterFile);

  try {
    const res = await fetch('/api/videos', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro ao enviar');
    showToast('Enviado! Convertendo em HLS (1080p–4K) em segundo plano...');
    document.getElementById('uploadForm').reset();
    selectedVideoFile = null; selectedPosterFile = null;
    ['videoDrop', 'posterDrop'].forEach(id => {
      const elx = document.getElementById(id);
      elx.classList.remove('has-file'); delete elx.dataset.filled;
    });
    document.getElementById('videoDrop').textContent = 'Arraste o vídeo aqui ou clique para escolher';
    document.getElementById('posterDrop').textContent = 'Arraste a capa aqui ou clique para escolher';
    loadVideos();
  } catch (err) {
    showToast(err.message);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar e processar';
  }
});

function statusPill(status) {
  if (status === 'ready') return `<span class="status-pill ready">pronto</span>`;
  if (status === 'error') return `<span class="status-pill error">erro</span>`;
  return `<span class="status-pill processing">${status}</span>`;
}

async function loadVideos() {
  const res = await fetch('/api/videos');
  const videos = await res.json();
  const tbody = document.querySelector('#videosTable tbody');
  tbody.innerHTML = videos.map(v => `
    <tr>
      <td>${v.title}</td>
      <td>${v.category}</td>
      <td>${v.orientation === 'vertical' ? '📱 Capa' : '🎬 Filme'}</td>
      <td>${ownerLabel(v.owner_user_id)}</td>
      <td>${statusPill(v.status)}</td>
      <td>${v.max_quality || '—'}</td>
      <td><button class="icon-btn" onclick="deleteVideo(${v.id}, '${v.title.replace(/'/g, "\\'")}')">Excluir</button></td>
    </tr>
  `).join('') || `<tr><td colspan="7" style="color:var(--ink-dim);">Nenhum vídeo cadastrado ainda.</td></tr>`;

  const stillProcessing = videos.some(v => v.status.startsWith('processing'));
  if (stillProcessing && !pollTimer) pollTimer = setInterval(loadVideos, 4000);
  else if (!stillProcessing && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

window.deleteVideo = async (id, title) => {
  if (!confirm(`Excluir "${title}"? Isso remove o vídeo do R2 também.`)) return;
  await fetch(`/api/videos/${id}`, { method: 'DELETE' });
  showToast('Excluído');
  loadVideos();
};

// ---------- Álbuns ----------
document.getElementById('albumForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const payload = {
    title: document.getElementById('albumTitle').value,
    category: document.getElementById('albumCategory').value,
    description: document.getElementById('albumDescription').value,
    ownerUserId: document.getElementById('albumOwner').value
  };
  const res = await fetch('/api/albums', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (!res.ok) { showToast(data.error || 'Erro ao criar álbum'); return; }
  showToast('Álbum criado! Agora adicione as fotos na lista abaixo.');
  document.getElementById('albumForm').reset();
  loadAlbums();
  openPhotoUpload(data.id, payload.title);
});

async function loadAlbums() {
  const res = await fetch('/api/albums');
  const albums = await res.json();
  const tbody = document.querySelector('#albumsTable tbody');
  tbody.innerHTML = albums.map(a => `
    <tr>
      <td>${a.title}</td>
      <td>${a.category}</td>
      <td>${ownerLabel(a.owner_user_id)}</td>
      <td id="photoCount-${a.id}">…</td>
      <td>
        <button class="icon-btn" style="color:var(--gold);" onclick="openPhotoUpload(${a.id}, '${a.title.replace(/'/g, "\\'")}')">+ fotos</button>
        <a class="icon-btn" style="color:var(--gold); text-decoration:none;" href="album.html?id=${a.id}" target="_blank">ver</a>
        <button class="icon-btn" onclick="deleteAlbum(${a.id}, '${a.title.replace(/'/g, "\\'")}')">excluir</button>
      </td>
    </tr>
  `).join('') || `<tr><td colspan="5" style="color:var(--ink-dim);">Nenhum álbum cadastrado ainda.</td></tr>`;

  for (const a of albums) {
    fetch(`/api/albums/${a.id}`).then(r => r.json()).then(full => {
      const cell = document.getElementById(`photoCount-${a.id}`);
      if (cell) cell.textContent = full.allPhotosCount ?? 0;
    });
  }
}

window.openPhotoUpload = async (albumId, title) => {
  activeAlbumIdForUpload = albumId;
  document.getElementById('photoUploadArea').style.display = 'block';
  document.getElementById('photoUploadAlbumTitle').textContent = title;
  await loadSectionsForAlbum(albumId);
  document.getElementById('photoUploadArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

async function loadSectionsForAlbum(albumId) {
  const res = await fetch(`/api/albums/${albumId}`);
  const album = await res.json();
  const select = document.getElementById('sectionSelect');
  select.innerHTML = `<option value="">Sem seção (fotos gerais)</option>` +
    (album.sections || []).map(s => `<option value="${s.id}">${s.title} (${s.photos.length} fotos)</option>`).join('');
}

document.getElementById('createSectionBtn').addEventListener('click', async () => {
  const title = document.getElementById('newSectionTitle').value.trim();
  if (!title || !activeAlbumIdForUpload) { showToast('Digite o nome da seção'); return; }
  const res = await fetch(`/api/albums/${activeAlbumIdForUpload}/sections`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title })
  });
  const data = await res.json();
  if (!res.ok) { showToast(data.error || 'Erro ao criar seção'); return; }
  document.getElementById('newSectionTitle').value = '';
  await loadSectionsForAlbum(activeAlbumIdForUpload);
  document.getElementById('sectionSelect').value = data.id;
  showToast(`Seção "${title}" criada — agora escolha as fotos e envie.`);
});

document.getElementById('cancelPhotoUpload').addEventListener('click', () => {
  activeAlbumIdForUpload = null;
  document.getElementById('photoUploadArea').style.display = 'none';
  document.getElementById('photoFilesInput').value = '';
});

document.getElementById('uploadPhotosBtn').addEventListener('click', async () => {
  const files = document.getElementById('photoFilesInput').files;
  if (!files.length || !activeAlbumIdForUpload) { showToast('Escolha ao menos uma foto'); return; }
  const fd = new FormData();
  for (const f of files) fd.append('photos', f);
  const sectionId = document.getElementById('sectionSelect').value;
  if (sectionId) fd.append('sectionId', sectionId);

  const btn = document.getElementById('uploadPhotosBtn');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const res = await fetch(`/api/albums/${activeAlbumIdForUpload}/photos`, { method: 'POST', body: fd });

// js/contract.js
let currentContract = null;
let signaturePad = null;
let isDrawing = false;
let hasSignature = false;

function el(id) { return document.getElementById(id); }

async function loadContract() {
  const user = await requireSession();
  const params = new URLSearchParams(window.__demoSearch());
  const idParam = params.get('id');

  let contract;
  if (idParam) {
    const res = await fetch(`/api/contracts/${idParam}`);
    if (!res.ok) { renderEmpty(); return; }
    contract = await res.json();
  } else {
    const res = await fetch('/api/contracts/mine');
    const list = res.ok ? await res.json() : [];
    if (!list.length) { renderEmpty(); return; }
    contract = list[0];
  }

  currentContract = contract;
  render(contract, user);
}

function renderEmpty() {
  el('contractWrap').innerHTML = `
    <div class="empty-state">
      <h2>Nenhum contrato disponível</h2>
      <p>Assim que o fotógrafo cadastrar seu contrato, ele aparece aqui.</p>
    </div>`;
}

function render(contract, user) {
  const isSigned = contract.status === 'signed';
  const eventsHTML = contract.events.map(ev => `
    <div class="contract-event">
      <h3>${ev.title}</h3>
      ${ev.event_date ? `<div class="date">${ev.event_date}</div>` : ''}
      <ul>${ev.items.map(item => `<li>${item}</li>`).join('')}</ul>
    </div>
  `).join('') || '<p style="color:var(--ink-dim); font-size:13px;">Nenhum evento detalhado neste contrato.</p>';

  el('contractWrap').innerHTML = `
    <h1>${contract.title}</h1>
    <span class="contract-status ${isSigned ? 'signed' : 'pending'}">${isSigned ? '✔ Assinado' : '⏳ Aguardando assinatura'}</span>

    ${contract.body ? `<div class="contract-body">${contract.body}</div>` : ''}

    <h2 style="font-size:17px; margin-bottom:12px;">Eventos contratados</h2>
    ${eventsHTML}

    <div id="signatureArea"></div>
  `;

  if (isSigned) {
    el('signatureArea').innerHTML = `
      <div class="signed-block">
        <img src="${contract.signature_data_url}" alt="Assinatura">
        <p style="font-size:13px; color:var(--ink-dim);">Assinado por <b style="color:var(--ink);">${contract.signer_name}</b><br>
        em ${new Date(contract.signed_at).toLocaleString('pt-BR')}</p>
        <a class="btn btn-primary" href="/api/contracts/${contract.id}/pdf" style="margin-top:14px;">⬇ Baixar contrato (PDF)</a>
      </div>
    `;
  } else if (!user.isAdmin) {
    el('signatureArea').innerHTML = `
      <div class="signature-pad-wrap">
        <label>Assine no campo abaixo (use o dedo ou o mouse)</label>
        <canvas id="signaturePad"></canvas>
        <div class="field" style="margin-top:14px;">
          <label>Seu nome completo</label>
          <input type="text" id="signerName" placeholder="Nome como consta no contrato">
        </div>
        <div class="signature-actions">
          <button class="btn btn-ghost" id="clearSignatureBtn" type="button">Limpar</button>
          <button class="btn btn-primary" id="signBtn" type="button">Assinar contrato</button>
        </div>
      </div>
    `;
    setupSignaturePad();
  } else {
    el('signatureArea').innerHTML = `<p style="color:var(--ink-dim); font-size:13px;">Aguardando o cliente assinar.</p>`;
  }
}

function setupSignaturePad() {
  const canvas = el('signaturePad');
  const ctx = canvas.getContext('2d');
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#0d1420';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  signaturePad = { canvas, ctx };

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return { x: point.clientX - rect.left, y: point.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    isDrawing = true;
    hasSignature = true;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
  function move(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  function end() { isDrawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  el('clearSignatureBtn').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasSignature = false;
  });

  el('signBtn').addEventListener('click', async () => {
    const name = el('signerName').value.trim();
    if (!name) { alert('Digite seu nome completo.'); return; }
    if (!hasSignature) { alert('Faça sua assinatura no campo acima.'); return; }

    const signBtn = el('signBtn');
    signBtn.disabled = true;
    signBtn.textContent = 'Assinando...';

    const signatureDataUrl = canvas.toDataURL('image/png');
    const res = await fetch(`/api/contracts/${currentContract.id}/sign`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ signerName: name, signatureDataUrl })
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || 'Erro ao assinar');
      signBtn.disabled = false;
      signBtn.textContent = 'Assinar contrato';
      return;
    }
    loadContract();
  });
}

loadContract();

      <span>${item.default_included ? '✓' : '＋'} ${item.label}</span>
      ${item.price > 0 ? `<span class="item-price">${item.default_included ? 'incluso' : '+' + formatBRL(item.price)}</span>` : ''}
    </li>
  `).join('');

  const customizeItemsHTML = pkg.items.map(item => `
    <label class="customize-item">
      <input type="checkbox" data-pkg="${pkg.id}" data-item="${item.id}" data-price="${item.price}" ${item.default_included ? 'checked' : ''}>
      <span class="label">${item.label}</span>
      <span class="price">${formatBRL(item.price)}</span>
    </label>
  `).join('');

  return `
    <div class="package-card" data-package-id="${pkg.id}">
      <h2>${pkg.title}</h2>
      <p class="desc">${pkg.description || ''}</p>
      <div class="package-price">${formatBRL(pkg.basePrice)} <span>pacote padrão</span></div>
      <ul class="package-items-list">${itemsListHTML}</ul>

      <div class="customize-panel" id="customize-${pkg.id}">
        <p style="font-size:12.5px; color:var(--ink-dim); margin-bottom:8px;">Marque ou desmarque os itens pra montar seu pacote:</p>
        ${customizeItemsHTML}
        <div class="package-total">Total: <span id="total-${pkg.id}">${formatBRL(pkg.basePrice)}</span></div>
      </div>

      <div class="checkout-form" id="checkoutForm-${pkg.id}">
        <div class="field"><label>Seu nome</label><input type="text" id="payerName-${pkg.id}" placeholder="Nome completo"></div>
        <div class="field"><label>Seu e-mail</label><input type="email" id="payerEmail-${pkg.id}" placeholder="voce@email.com" required></div>
        <button class="btn btn-primary" style="width:100%; justify-content:center;" onclick="goToPayment(${pkg.id})">Ir para o pagamento →</button>
      </div>

      <div class="package-actions">
        <button class="btn btn-primary" onclick="startCheckout(${pkg.id}, true)">Contratar agora</button>
        <button class="btn btn-ghost" onclick="toggleCustomize(${pkg.id})">Personalizar itens</button>
      </div>
    </div>
  `;
}

async function loadPackages() {
  const res = await fetch('/api/packages');
  const grid = document.getElementById('packagesGrid');
  if (!res.ok) { grid.innerHTML = `<p style="color:var(--ink-dim); padding:0 40px;">Erro ao carregar pacotes.</p>`; return; }
  const packages = await res.json();

  if (!packages.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><h2>Nenhum pacote disponível ainda</h2><p>Em breve os pacotes de serviço aparecem aqui.</p></div>`;
    return;
  }

  grid.innerHTML = packages.map(packageCardHTML).join('');

  // Recalcula o total ao vivo conforme o cliente marca/desmarca itens
  grid.querySelectorAll('.customize-item input').forEach(input => {
    input.addEventListener('change', () => {
      const pkgId = input.dataset.pkg;
      const checkboxes = grid.querySelectorAll(`.customize-item input[data-pkg="${pkgId}"]`);
      let total = 0;
      checkboxes.forEach(cb => { if (cb.checked) total += Number(cb.dataset.price); });
      document.getElementById(`total-${pkgId}`).textContent = formatBRL(total);
    });
  });
}

window.toggleCustomize = (pkgId) => {
  document.getElementById(`customize-${pkgId}`).classList.toggle('open');
};

window.startCheckout = (pkgId, useDefault) => {
  document.getElementById(`checkoutForm-${pkgId}`).classList.add('open');
  document.getElementById(`checkoutForm-${pkgId}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
};

window.goToPayment = async (pkgId) => {
  const name = document.getElementById(`payerName-${pkgId}`).value.trim();
  const email = document.getElementById(`payerEmail-${pkgId}`).value.trim();
  if (!email) { alert('Digite seu e-mail pra continuar.'); return; }

  const card = document.querySelector(`.package-card[data-package-id="${pkgId}"]`);
  const customizeOpen = document.getElementById(`customize-${pkgId}`).classList.contains('open');
  let selectedItemIds = null;
  if (customizeOpen) {
    selectedItemIds = Array.from(card.querySelectorAll('.customize-item input:checked')).map(cb => Number(cb.dataset.item));
  }

  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Redirecionando...';

  try {
    const res = await fetch(`/api/packages/${pkgId}/checkout`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ selectedItemIds, payerName: name, payerEmail: email })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro ao iniciar pagamento');
    __demoGo(data.checkoutUrl);
  } catch (err) {
    alert(err.message);
    btn.disabled = false;
    btn.textContent = 'Ir para o pagamento →';
  }
};

(async () => {
  const user = await trySession();
  document.getElementById('myAreaLink').style.display = user ? 'block' : 'none';
  loadPackages();
})();

} },

"compartilhado.html": { title: "Álbum compartilhado — Duna", body: "<header class=\"topbar\">\n    <div class=\"topbar-spacer\"></div>\n    <a href=\"portfolio.html\" class=\"brand\"><img src=\"img/logo-duna.png\" alt=\"Duna\" class=\"brand-logo\"></a>\n    <div class=\"topbar-spacer\"></div>\n  </header>\n\n  <div class=\"album-header\" id=\"albumHeader\"></div>\n  <main class=\"photo-grid\" id=\"photoGrid\"></main>\n\n  <div class=\"lightbox\" id=\"lightbox\">\n    <button class=\"lightbox-close\" id=\"lightboxClose\">✕</button>\n    <button class=\"lightbox-nav lightbox-prev\" id=\"lightboxPrev\">‹</button>\n    <img id=\"lightboxImg\" src=\"\" alt=\"\">\n    <button class=\"lightbox-nav lightbox-next\" id=\"lightboxNext\">›</button>\n  </div>", run: function () {
// js/compartilhado.js
let shareData = null;
let currentIndex = 0;
function el(id) { return document.getElementById(id); }

async function load() {
  const params = new URLSearchParams(window.__demoSearch());
  const token = params.get('t');
  if (!token) { el('albumHeader').innerHTML = '<p style="padding:0 40px; color:var(--ink-dim);">Link inválido.</p>'; return; }

  const res = await fetch(`/api/albums/share/${token}`);
  if (!res.ok) {
    el('albumHeader').innerHTML = `<div style="text-align:center; padding:60px 20px;"><h1 style="font-size:22px;">Link inválido ou expirado</h1></div>`;
    return;
  }
  shareData = await res.json();
  shareData.__flat = [...shareData.sections.flatMap(s => s.photos), ...shareData.photos];

  el('albumHeader').innerHTML = `<h1>${shareData.title}</h1><p>${shareData.description || ''}</p>`;

  function grid(photos) {
    if (!photos.length) return '';
    return `<div class="photo-grid">${photos.map(p => {
      const i = shareData.__flat.findIndex(fp => fp.id === p.id);
      return `<div class="photo-thumb" style="background-image:url('${p.thumb_url}')" onclick="openLightbox(${i})">
        ${shareData.allowDownload ? `<a class="photo-download-btn" href="${p.url}" download onclick="event.stopPropagation()" title="Baixar">⬇</a>` : ''}
      </div>`;
    }).join('')}</div>`;
  }

  let html = '';
  for (const s of shareData.sections) {
    if (!s.photos.length) continue;
    html += `<div class="section-block">
      <div class="section-banner" style="background-image:url('${s.cover_url || ''}')">
        <div class="section-banner-text"><h2>${s.title}</h2>${s.description ? `<p>${s.description}</p>` : ''}</div>
      </div>${grid(s.photos)}</div>`;
  }
  if (shareData.photos.length) html += grid(shareData.photos);

  document.getElementById('photoGrid').outerHTML = `<main id="photoGrid">${html || '<div class="empty-state"><h2>Nenhuma foto aqui ainda</h2></div>'}</main>`;
}

function openLightbox(i) {
  currentIndex = i;
  el('lightboxImg').src = shareData.__flat[i].url;
  el('lightbox').classList.add('open');
}
window.openLightbox = openLightbox;
el('lightboxClose').addEventListener('click', () => el('lightbox').classList.remove('open'));
el('lightboxPrev').addEventListener('click', () => { currentIndex = (currentIndex - 1 + shareData.__flat.length) % shareData.__flat.length; el('lightboxImg').src = shareData.__flat[currentIndex].url; });
el('lightboxNext').addEventListener('click', () => { currentIndex = (currentIndex + 1) % shareData.__flat.length; el('lightboxImg').src = shareData.__flat[currentIndex].url; });

load();

} },
"convidados.html": { title: "Envie suas fotos — Duna", body: "<div class=\"auth-wrap\">\n    <div class=\"auth-card\" style=\"max-width:420px;\">\n      <span class=\"brand\" style=\"display:block; text-align:center; margin-bottom:18px;\"><img src=\"img/logo-duna.png\" alt=\"Duna\" class=\"brand-logo\" style=\"margin:0 auto;\"></span>\n      <div id=\"content\">\n        <p style=\"text-align:center; color:var(--ink-dim);\">Carregando...</p>\n      </div>\n    </div>\n  </div>", run: function () {
// js/convidados.js
(async () => {
  const params = new URLSearchParams(window.__demoSearch());
  const token = params.get('t');
  const content = document.getElementById('content');
  if (!token) { content.innerHTML = '<p style="text-align:center;">Link inválido.</p>'; return; }

  const res = await fetch(`/api/albums/guest-upload/${token}`);
  if (!res.ok) { content.innerHTML = '<p style="text-align:center;">Este link de envio não está mais ativo.</p>'; return; }
  const album = await res.json();

  content.innerHTML = `
    <h2 style="font-size:18px; text-align:center; margin-bottom:6px;">${album.title}</h2>
    <p style="text-align:center; color:var(--ink-dim); font-size:13px; margin-bottom:20px;">Compartilhe suas fotos e vídeos do casamento com os noivos!</p>
    <div class="field"><label>Seu nome</label><input type="text" id="uploaderName" placeholder="Como quer aparecer"></div>
    <div class="file-field" id="dropZone">Toque aqui pra escolher suas fotos</div>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
    <button class="btn btn-primary" id="sendBtn" style="width:100%; justify-content:center; margin-top:14px;">Enviar fotos</button>
    <p id="status" style="text-align:center; font-size:13px; color:var(--gold); margin-top:12px;"></p>
  `;

  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  let selectedFiles = [];

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    selectedFiles = Array.from(fileInput.files);
    dropZone.textContent = `${selectedFiles.length} foto(s) selecionada(s)`;
    dropZone.classList.add('has-file');
  });

  document.getElementById('sendBtn').addEventListener('click', async () => {
    if (!selectedFiles.length) { alert('Escolha ao menos uma foto.'); return; }
    const name = document.getElementById('uploaderName').value.trim();
    const fd = new FormData();
    fd.append('uploaderName', name || 'Convidado');
    selectedFiles.forEach(f => fd.append('photos', f));

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try {
      const uploadRes = await fetch(`/api/albums/guest-upload/${token}/photos`, { method: 'POST', body: fd });
      const data = await uploadRes.json();
      if (!uploadRes.ok) throw new Error(data.error || 'Erro ao enviar');
      document.getElementById('status').textContent = `Obrigado! Suas ${data.uploading} foto(s) já estão a caminho do álbum. 🎉`;
      btn.textContent = 'Enviado!';
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
      btn.textContent = 'Enviar fotos';
    }
  });
})();

} },

// js/auth-guard.js
// Verifica sessão antes de renderizar a página; redireciona pro login se necessário.
window.CURRENT_USER = null;

async function requireSession() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) throw new Error();
    const user = await res.json();
    window.CURRENT_USER = user;
    const adminLink = document.getElementById('adminLink');
    if (adminLink && user.isAdmin) adminLink.style.display = 'block';
    return user;
  } catch {
    __demoGo('login.html');
    throw new Error('redirecting');
  }
}

// Versão que NÃO redireciona — usada em páginas públicas (portfólio, vídeo/álbum públicos)
async function trySession() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) throw new Error();
    const user = await res.json();
    window.CURRENT_USER = user;
    const adminLink = document.getElementById('adminLink');
    if (adminLink && user.isAdmin) adminLink.style.display = 'block';
    return user;
  } catch {
    window.CURRENT_USER = null;
    return null;
  }
}

document.addEventListener('DOMContentLoaded', () => {

  if (logoutBtn) {
    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      __demoGo('login.html');
    });
  }

  // Menu símbolo (☰) no topbar — abre/fecha o dropdown de navegação
  const menuToggle = document.getElementById('menuToggle');
  const menuDropdown = document.getElementById('menuDropdown');
  if (menuToggle && menuDropdown) {
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      menuDropdown.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!menuDropdown.contains(e.target) && e.target !== menuToggle) {
        menuDropdown.classList.remove('open');
      }
    });
  }
});

;
