<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagamento recebido — Duna</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center; max-width:440px;">
      <span class="brand" style="display:block; margin-bottom:20px;"><img src="/img/logo-duna.png" alt="Duna" class="brand-logo" style="margin:0 auto;"></span>
      <div style="font-size:44px; margin-bottom:10px;">🎉</div>
      <h1 style="font-size:22px; margin-bottom:10px;">Recebemos sua contratação!</h1>
      <p style="color:var(--ink-dim); font-size:14px; line-height:1.6; margin-bottom:22px;">
        Assim que o pagamento for confirmado, entraremos em contato pelo e-mail informado pra alinhar os próximos passos e o contrato.
      </p>
      <a class="btn btn-primary" href="/">Voltar ao início</a>
    </div>
  </div>
</body>
</html>
