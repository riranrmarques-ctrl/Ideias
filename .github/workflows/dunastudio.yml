name: Publicar DunaStudio

on:
  push:
    branches: [claude/programming-question-iaylc8, main]
    paths:
      - 'DunaStudio/cloudflare/**'
      - '.github/workflows/dunastudio.yml'
  workflow_dispatch:

concurrency:
  group: dunastudio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DunaStudio/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conferir segredos
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Enviar as páginas para o R2 (hosp/studio/)
        run: |
          cd site
          npm install -g wrangler@4 >/dev/null
          find . -type f | sed 's#^\./##' | while read -r file; do
            wrangler r2 object put "hosp/studio/$file" --file "$file" --remote
          done

      - name: Publicar o Worker
        run: wrangler deploy
